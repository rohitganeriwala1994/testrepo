name: Deploy to UiPath Orchestrator

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT_DIR: HelloWorld_Rohit
  PACKAGE_VERSION: 1.0.${{ github.run_number }}
  UIPATH_CLI_VERSION: 1.206.0

jobs:
  deploy:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install UiPath CLI (pinned)
        run: npm install -g "@uipath/cli@$env:UIPATH_CLI_VERSION"

      - name: Login to UiPath
        env:
          ORG:  ${{ secrets.UIPATH_ORG }}
          TEN:  ${{ secrets.UIPATH_TENANT }}
          CID:  ${{ secrets.UIPATH_APP_ID }}
          CSEC: ${{ secrets.UIPATH_APP_SECRET }}
        run: |
          foreach ($n in 'ORG','TEN','CID','CSEC') {
            if (-not (Get-Item "env:$n" -ErrorAction SilentlyContinue).Value) {
              Write-Error "Secret for $n is empty - check the secret name in repo settings"; exit 1
            }
          }
          uip login --authority https://staging.uipath.com `
            --organization "$env:ORG" --tenant "$env:TEN" `
            --client-id "$env:CID" --client-secret "$env:CSEC"

      - name: Set package version
        run: |
          $p = Join-Path $env:PROJECT_DIR 'project.json'
          $j = Get-Content $p -Raw | ConvertFrom-Json
          $j.projectVersion = $env:PACKAGE_VERSION
          $j | ConvertTo-Json -Depth 100 | Set-Content $p -Encoding utf8

      - name: Pack project
        run: uip rpa pack "$env:PROJECT_DIR" ./dist

      - name: Publish to Orchestrator
        run: |
          $pkg = Get-ChildItem ./dist/*.nupkg | Select-Object -First 1
          if (-not $pkg) { Write-Error "No .nupkg in ./dist"; exit 1 }
          uip rpa publish $pkg.FullName
